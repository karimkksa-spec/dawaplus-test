services:
  - type: web
    name: dawaplus-test
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PILOT_ACCOUNTS
        sync: false
